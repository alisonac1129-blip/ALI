<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tabla con Bordes</title>
<style>
/* Estilo para la tabla y sus celdas */
table, th, td {
border: 1px solid black; /* Establece un borde sólido de 1 píxel de color negro */
border-collapse: collapse; /* Une los bordes dobles en uno solo */
padding: 8px; /* Añade espacio interno para que el texto no toque los bordes */
text-align: left; /* Alinea el texto a la izquierda */
}
/* Estilo opcional para el encabezado */
th {
background-color: #f2f2f2; /* Color de fondo gris claro para los títulos */
}
</style>
</head>
<body>
<table>
<thead>
<tr>
<th>ETQUITAS 1</th>
<th>ETQUITAS 2</th>
<th>LULU</th>
</tr>
</thead>
<tbody>
<tr>
<td>Dato A1</td>
<td>Dato A2</td>
<td>Dato A3</td>
</tr>
<tr>
<td>Dato B1</td>
<td>Dato B2</td>
<td>Dato B3</td>
</tr>
</tbody>
</table>
</body>
</html>
